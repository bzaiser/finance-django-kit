{% extends "design_studio/layouts/base.html" %}
{% block title %}Finanz-Stammdaten{% endblock %}
{% block content %}
{% include "finance_kit/includes/_finance_tabs.html" %}

<form method="post" class="card shadow-sm">
    {% csrf_token %}
    <div class="card-header fw-bold"><i class="bi bi-gear me-1"></i>Stammdaten für Spendenquittungen &amp; Rechnungen</div>
    <div class="card-body row g-3">
        <div class="col-md-6"><label class="form-label small">Organisationsname</label><input type="text" name="org_name" class="form-control" value="{{ cfg.org_name }}"></div>
        <div class="col-md-6"><label class="form-label small">Steuernummer / USt-ID</label><input type="text" name="tax_number" class="form-control" value="{{ cfg.tax_number }}"></div>
        <div class="col-md-6"><label class="form-label small">Finanzamt</label><input type="text" name="tax_office" class="form-control" value="{{ cfg.tax_office }}"></div>
        <div class="col-md-3"><label class="form-label small">Freistellungsbescheid vom</label><input type="date" name="exemption_date" class="form-control" value="{{ cfg.exemption_date|date:'Y-m-d' }}"></div>
        <div class="col-md-3"><label class="form-label small">Standard-USt (%)</label><input type="text" name="default_vat_rate" class="form-control" value="{{ cfg.default_vat_rate }}"></div>
        <div class="col-12"><label class="form-label small">Anschrift</label><textarea name="org_address" class="form-control" rows="2">{{ cfg.org_address }}</textarea></div>
        <div class="col-12">
            <div class="form-check">
                <input type="checkbox" name="small_business_rule" class="form-check-input" id="sbRule" {% if cfg.small_business_rule %}checked{% endif %}>
                <label class="form-check-label small" for="sbRule">Kleinunternehmerregelung (§ 19 UStG)</label>
            </div>
        </div>
    </div>
    <div class="card-footer text-end"><button type="submit" class="btn btn-primary rounded-pill px-4">Speichern</button></div>
</form>
{% endblock %}
